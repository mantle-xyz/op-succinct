[workspace]
members = [
    "utils/client",
    "utils/host",
    "utils/build",
    "utils/proof",
    "utils/signer",
    "utils/ethereum/client",
    "utils/ethereum/host",
    "programs/range/*",
    "programs/aggregation",
    "scripts/*",
    "validity",
    "bindings",
]
resolver = "2"

[workspace.package]
license = "MIT"
edition = "2021"
authors = ["ratankaliani", "zachobront", "fakedev9999", "yuwen01"]
homepage = "https://succinctlabs.github.io/op-succinct/"
repository = "https://github.com/succinctlabs/op-succinct"
version = "3.8.1"

[workspace.dependencies]
# general
anyhow = { version = "1.0.86", default-features = false }
thiserror = { version = "2.0.3" }
cfg-if = "1.0.0"
spin = { version = "0.10.0" }
lru = "0.12.3"
async-trait = "0.1.80"
sha2 = "0.10.8"
tokio = { version = "1.44.2", features = ["full"] }
clap = "4.5.9"
cargo_metadata = "0.18.1"
dotenv = "0.15.0"
num-format = "0.4.4"
futures = "0.3.30"
serde_cbor = "0.11.2"
log = "0.4.22"
itertools = "0.13.0"
reqwest = { version = "0.12", features = ["json"] }
csv = "1.3.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.117", default-features = false }
rkyv = { version = "0.8", features = ["hashbrown-0_15", "std"] }
hex = "0.4.3"
bincode = "1.3.3"
base64 = "0.22.1"
tower-http = { version = "0.5.2", features = ["limit"] }
lazy_static = "1.5.0"
tracing = { version = "0.1.40", default-features = false }
tracing-subscriber = { version = "0.3.22", features = ["fmt", "json"] }
tracing-opentelemetry = "^0.24"
opentelemetry = { version = "^0.23.0", features = ["trace"] }
opentelemetry_sdk = { version = "^0.23.0", features = [
    "trace",
    "rt-tokio",
    "logs_level_enabled",
] }
opentelemetry-stdout = { version = "0.2.0", features = ["trace"] }
opentelemetry-otlp = { version = "^0.16.0", features = ["default", "logs"] }
opentelemetry-appender-tracing = "0.4.0"

# [MANTLE] Aligned to 0.18 to match the version pulled transitively by kona-cli
# (kona-host). Two metrics-exporter-prometheus versions in one binary race over the
# single global `metrics` recorder, leaving the /metrics HTTP endpoint reading a
# different (frozen) registry than the one ValidityGauge::set() writes to.
metrics = "0.24.1"
metrics-exporter-prometheus = "0.18"
metrics-process = "2.4.0"
strum = "0.27.1"
strum_macros = "0.27.1"
tempfile = "3.10.1"

# vergen - pin to exact versions for rollup-boost compatibility
vergen = "=9.0.4"
vergen-git2 = "=1.0.5"

# kona
kona-mpt = { git = "https://github.com/mantlenetworkio/mantle-v2", rev = "729d5189bbd0411d85ee104a418591d5a4f628cd" }
kona-derive = { git = "https://github.com/mantlenetworkio/mantle-v2", rev = "729d5189bbd0411d85ee104a418591d5a4f628cd", default-features = false }
kona-driver = { git = "https://github.com/mantlenetworkio/mantle-v2", rev = "729d5189bbd0411d85ee104a418591d5a4f628cd" }
kona-preimage = { git = "https://github.com/mantlenetworkio/mantle-v2", rev = "729d5189bbd0411d85ee104a418591d5a4f628cd", features = [
    "rkyv",
    "serde",
] }
kona-executor = { git = "https://github.com/mantlenetworkio/mantle-v2", rev = "729d5189bbd0411d85ee104a418591d5a4f628cd" }
kona-proof = { git = "https://github.com/mantlenetworkio/mantle-v2", rev = "729d5189bbd0411d85ee104a418591d5a4f628cd" }

kona-client = { git = "https://github.com/mantlenetworkio/mantle-v2", rev = "729d5189bbd0411d85ee104a418591d5a4f628cd" }
kona-host = { git = "https://github.com/mantlenetworkio/mantle-v2", rev = "729d5189bbd0411d85ee104a418591d5a4f628cd" }
kona-providers-alloy = { git = "https://github.com/mantlenetworkio/mantle-v2", rev = "729d5189bbd0411d85ee104a418591d5a4f628cd" }
# Note: kona-rpc is NOT included to avoid rollup-boost -> reth-optimism-primitives dependency.
# RPC types are defined locally in utils/host/src/rpc_types.rs instead.
kona-protocol = { git = "https://github.com/mantlenetworkio/mantle-v2", rev = "729d5189bbd0411d85ee104a418591d5a4f628cd", default-features = false }
kona-registry = { git = "https://github.com/mantlenetworkio/mantle-v2", rev = "729d5189bbd0411d85ee104a418591d5a4f628cd", default-features = false }
kona-genesis = { git = "https://github.com/mantlenetworkio/mantle-v2", rev = "729d5189bbd0411d85ee104a418591d5a4f628cd", default-features = false }

# op-succinct
op-succinct-prove = { path = "scripts/prove" }
op-succinct-client-utils = { path = "utils/client" }
op-succinct-host-utils = { path = "utils/host" }
op-succinct-build-utils = { path = "utils/build" }
op-succinct-elfs = { path = "utils/elfs" }
op-succinct-validity = { path = "validity" }
op-succinct-ethereum-client-utils = { path = "utils/ethereum/client" }
op-succinct-ethereum-host-utils = { path = "utils/ethereum/host" }
op-succinct-proof-utils = { path = "utils/proof" }
op-succinct-signer-utils = { path = "utils/signer" }
op-succinct-range-utils = { path = "programs/range/utils" }
op-succinct-bindings = { path = "bindings" }

# Alloy (Network)
alloy-signer-local = { version = "2.0.4" }
alloy-provider = { version = "2.0.4" }
alloy-transport = { version = "2.0.4" }
alloy-transport-http = { version = "2.0.4" }
alloy-contract = { version = "2.0.4" }
alloy-network = { version = "2.0.4" }

# Alloy
alloy-rlp = { version = "0.3.13", default-features = false }
alloy-trie = { version = "0.9.4", default-features = false, features = [
    "ethereum",
] }
alloy-eips = { version = "2.0.4", default-features = false }
alloy-serde = { version = "2.0.4", default-features = false }
alloy-consensus = { version = "2.0.4", default-features = false }
alloy-tx-macros = { version = "2.0.4", default-features = false }
alloy-rpc-types = { version = "2.0.4", default-features = false }
alloy-rpc-client = { version = "2.0.4", default-features = false }
alloy-node-bindings = { version = "2.0.4", default-features = false }
alloy-rpc-types-engine = { version = "2.0.4", default-features = false }
alloy-rpc-types-beacon = { version = "2.0.4", default-features = false }
alloy-rpc-types-eth = { version = "2.0.4", default-features = false }
alloy-rpc-types-trace = { version = "2.0.4", default-features = false }
alloy-signer = { version = "2.0.4", default-features = false }
alloy-signer-gcp = { version = "2.0.4", default-features = false }
alloy = { version = "2.0.4", features = [
    "reqwest",
    "network",
    "providers",
    "sol-types",
    "rpc-types",
] }

# Keccak with the SHA3 patch is more efficient than the default Keccak.
alloy-primitives = { version = "1.5.6", default-features = false, features = [
    "sha3-keccak",
] }
alloy-sol-types = { version = "1.5.6", default-features = false }
alloy-sol-macro = { version = "1.5.6", default-features = false }
alloy-chains = { version = "0.2.33", default-features = false }

# OP Alloy - from mantle-v2 rust workspace (aligned with kona develop + alloy 2.0.4)
op-alloy-consensus = { git = "https://github.com/mantlenetworkio/mantle-v2", rev = "729d5189bbd0411d85ee104a418591d5a4f628cd", default-features = false }
op-alloy-rpc-types = { git = "https://github.com/mantlenetworkio/mantle-v2", rev = "729d5189bbd0411d85ee104a418591d5a4f628cd", default-features = false }
op-alloy-rpc-types-engine = { git = "https://github.com/mantlenetworkio/mantle-v2", rev = "729d5189bbd0411d85ee104a418591d5a4f628cd", default-features = false }
op-alloy-network = { git = "https://github.com/mantlenetworkio/mantle-v2", rev = "729d5189bbd0411d85ee104a418591d5a4f628cd", default-features = false }

# Execution
alloy-evm = { version = "0.34.0", default-features = false }
alloy-op-evm = { git = "https://github.com/mantlenetworkio/mantle-v2", rev = "729d5189bbd0411d85ee104a418591d5a4f628cd", default-features = false }
# [MANTLE] revm sourced from mantle-xyz/revm-ghsa-5vfr-x84h-hmvf @ 99707e9f (revm v38 +
# Mantle protocol changes: ARSIA/JOVIAN, BVM_ETH, token_ratio, DA footprint,
# Arsia fee validation + GHSA-5vfr-x84h-hmvf fix). Aligns with mantle-v2 rust workspace.
revm = { git = "https://github.com/mantle-xyz/revm-ghsa-5vfr-x84h-hmvf", rev = "99707e9f", default-features = false, features = [
    "bn",
] }
revm-precompile = { git = "https://github.com/mantle-xyz/revm-ghsa-5vfr-x84h-hmvf", rev = "99707e9f", default-features = false }
op-revm = { git = "https://github.com/mantle-xyz/revm-ghsa-5vfr-x84h-hmvf", rev = "99707e9f", default-features = false }

# SP1 v6.1.0 (Hypercube)
sp1-sdk = { version = "=6.1.0", features = ["network", "blocking", "profiling"] }
sp1-lib = { version = "=6.1.0", features = ["verify"] }
sp1-zkvm = { version = "=6.1.0", features = ["verify"] }
sp1-build = "=6.1.0"
sp1-prover = "=6.1.0"
sp1-prover-types = "=6.1.0"
sp1-core-executor = "=6.1.0"
sp1-hypercube = "=6.1.0"
sp1-primitives = "=6.1.0"
sp1-cluster-artifact = { git = "https://github.com/succinctlabs/sp1-cluster.git", tag = "v2.1.5" }
sp1-cluster-common = { git = "https://github.com/succinctlabs/sp1-cluster.git", tag = "v2.1.5" }
sp1-cluster-utils = { git = "https://github.com/succinctlabs/sp1-cluster.git", tag = "v2.1.5" }

# kzg
kzg-rs = { version = "0.2.8", features = ["rkyv", "serde"] }
c-kzg = { version = "2.1.5", default-features = false }

# Cloud dependencies
gcloud-sdk = "0.27"

[profile.release-client-lto]
inherits = "release"
panic = "abort"
codegen-units = 1
lto = "fat"

[patch.crates-io]
sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha2", tag = "patch-sha2-0.10.9-sp1-6.0.0" }
sha3 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha3", tag = "patch-sha3-0.10.8-sp1-6.0.0" }
substrate-bn = { git = "https://github.com/sp1-patches/bn", tag = "patch-0.6.0-sp1-6.0.0-substrate-bn" }
p256 = { git = "https://github.com/sp1-patches/elliptic-curves", tag = "patch-p256-13.2-sp1-6.0.0" }
k256 = { git = "https://github.com/sp1-patches/elliptic-curves", tag = "patch-k256-13.4-sp1-6.0.0" }
tiny-keccak = { git = "https://github.com/sp1-patches/tiny-keccak", tag = "patch-2.0.2-sp1-6.0.0" }

# Patch op-alloy and alloy-op-evm to use the mantle-v2 versions
# Required so transitive deps from kona + op-alloy all resolve to the same source.
op-alloy-consensus = { git = "https://github.com/mantlenetworkio/mantle-v2", rev = "729d5189bbd0411d85ee104a418591d5a4f628cd" }
op-alloy-network = { git = "https://github.com/mantlenetworkio/mantle-v2", rev = "729d5189bbd0411d85ee104a418591d5a4f628cd" }
op-alloy-rpc-types = { git = "https://github.com/mantlenetworkio/mantle-v2", rev = "729d5189bbd0411d85ee104a418591d5a4f628cd" }
op-alloy-rpc-types-engine = { git = "https://github.com/mantlenetworkio/mantle-v2", rev = "729d5189bbd0411d85ee104a418591d5a4f628cd" }
op-alloy-provider = { git = "https://github.com/mantlenetworkio/mantle-v2", rev = "729d5189bbd0411d85ee104a418591d5a4f628cd" }
alloy-op-evm = { git = "https://github.com/mantlenetworkio/mantle-v2", rev = "729d5189bbd0411d85ee104a418591d5a4f628cd" }
alloy-op-hardforks = { git = "https://github.com/mantlenetworkio/mantle-v2", rev = "729d5189bbd0411d85ee104a418591d5a4f628cd" }
op-alloy = { git = "https://github.com/mantlenetworkio/mantle-v2", rev = "729d5189bbd0411d85ee104a418591d5a4f628cd" }

# [MANTLE] Patch every revm-family crate (including transitively-pulled ones) to
# mantle-xyz/revm-ghsa-5vfr-x84h-hmvf @ 99707e9f. Matches the pattern in mantle-v2/rust/Cargo.toml.
revm = { git = "https://github.com/mantle-xyz/revm-ghsa-5vfr-x84h-hmvf", rev = "99707e9f" }
revm-bytecode = { git = "https://github.com/mantle-xyz/revm-ghsa-5vfr-x84h-hmvf", rev = "99707e9f" }
revm-context = { git = "https://github.com/mantle-xyz/revm-ghsa-5vfr-x84h-hmvf", rev = "99707e9f" }
revm-context-interface = { git = "https://github.com/mantle-xyz/revm-ghsa-5vfr-x84h-hmvf", rev = "99707e9f" }
revm-database = { git = "https://github.com/mantle-xyz/revm-ghsa-5vfr-x84h-hmvf", rev = "99707e9f" }
revm-database-interface = { git = "https://github.com/mantle-xyz/revm-ghsa-5vfr-x84h-hmvf", rev = "99707e9f" }
revm-handler = { git = "https://github.com/mantle-xyz/revm-ghsa-5vfr-x84h-hmvf", rev = "99707e9f" }
revm-inspector = { git = "https://github.com/mantle-xyz/revm-ghsa-5vfr-x84h-hmvf", rev = "99707e9f" }
revm-interpreter = { git = "https://github.com/mantle-xyz/revm-ghsa-5vfr-x84h-hmvf", rev = "99707e9f" }
revm-precompile = { git = "https://github.com/mantle-xyz/revm-ghsa-5vfr-x84h-hmvf", rev = "99707e9f" }
revm-primitives = { git = "https://github.com/mantle-xyz/revm-ghsa-5vfr-x84h-hmvf", rev = "99707e9f" }
revm-state = { git = "https://github.com/mantle-xyz/revm-ghsa-5vfr-x84h-hmvf", rev = "99707e9f" }
op-revm = { git = "https://github.com/mantle-xyz/revm-ghsa-5vfr-x84h-hmvf", rev = "99707e9f" }

# [MANTLE] alloy-evm is intentionally NOT patched: it resolves from crates.io = upstream
# alloy-rs/evm v0.34.0. The former mantle-xyz/evm@mantle-v0.34.0 fork only added a dead-code
# `token_ratio` trait method; mantle-v2 rust dropped the fork at d2e4ebea (commit 75d90fc71),
# so we drop the patch here too to stay in lockstep. See MANTLE_CHANGES.md §2.2 / §3.1.

