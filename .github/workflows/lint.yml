name: Lint

on:
  push:
    tags:
      - v[0-9]+.*
    branches:
      - main
  pull_request:
    paths:
      - ".github/workflows/lint.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "justfile"
      - "crates/**"
      - "programs/**"
      - "scripts/**"
      - "utils/**"
      - "fault-proof/**"
      - "validity/**"
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Formatting & Clippy
    runs-on: 
      - runs-on
      - runner=32cpu-linux-arm64
      - run-id=${{ github.run_id }}
      - spot=false
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check SP1 version consistency
        run: |
          SP1_VERSION=$(grep 'sp1-sdk' Cargo.toml | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "Expected SP1 version from Cargo.toml: $SP1_VERSION"
          MISMATCHES=$(grep -rn 'sp1up -v' --include='Dockerfile*' | grep -v "$SP1_VERSION" || true)
          MISMATCHES+=$(grep -rn 'sp1up -v' .github/workflows/ --exclude='lint.yml' | grep -v "$SP1_VERSION" || true)
          MISMATCHES+=$(grep -n -- '--tag v' justfile | grep -v "$SP1_VERSION" || true)
          if [ -n "$MISMATCHES" ]; then
            echo "::error::SP1 version mismatch found. Expected $SP1_VERSION (from Cargo.toml):"
            echo "$MISMATCHES"
            exit 1
          fi
          echo "SP1 version consistency check passed"

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: nightly
          components: rustfmt, clippy

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Go
        run: |
          GO_ARCH=$(dpkg --print-architecture)
          curl -LO https://go.dev/dl/go1.24.0.linux-${GO_ARCH}.tar.gz
          sudo tar -C /usr/local -xzf go1.24.0.linux-${GO_ARCH}.tar.gz
          echo "/usr/local/go/bin" >> $GITHUB_PATH

      - name: Install SP1 toolchain
        run: |
          curl -L https://sp1.succinct.xyz | bash
          ~/.sp1/bin/sp1up -v 6.1.0
          ~/.sp1/bin/cargo-prove prove --version
          source ~/.bashrc

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      
      - name: Run cargo check
        uses: actions-rs/cargo@v1
        with:
          command: check
          args: --all-targets --all-features --tests

      - name: Check tonic version is unified with sp1-sdk
        run: |
          # validity classifies transport faults by downcasting the sp1-sdk's error to
          # `tonic::Status`. If the two crates resolve DIFFERENT tonic versions the downcast
          # silently returns None and the classifier degrades to substring matching — no
          # compile error, no test failure, just a quiet regression to the fragile behaviour
          # that typed matching was introduced to remove. Several tonic versions already
          # coexist in this tree, so guard the one pairing that must stay unified.
          VALIDITY=$(cargo tree -p op-succinct-validity --depth 1 -e normal | grep -oE 'tonic v[0-9.]+' | head -1)
          SDK=$(cargo tree -p sp1-sdk --depth 1 -e normal | grep -oE 'tonic v[0-9.]+' | head -1)
          echo "op-succinct-validity: ${VALIDITY:-<none>} / sp1-sdk: ${SDK:-<none>}"
          if [ -z "$VALIDITY" ] || [ "$VALIDITY" != "$SDK" ]; then
            echo "::error::tonic version drift: op-succinct-validity (${VALIDITY:-<none>}) and sp1-sdk (${SDK:-<none>}) must resolve the same tonic, otherwise is_transient_transport_error silently falls back to string matching. Update the tonic pin in validity/Cargo.toml."
            exit 1
          fi
          echo "tonic version check passed"

      - name: Run cargo fmt
        uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: --all -- --check

      - name: Run cargo clippy
        uses: actions-rs/cargo@v1
        with:
          command: clippy
          args: --all-features --all-targets -- -D warnings -A incomplete-features
