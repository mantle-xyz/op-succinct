name: SQLx Query Check

on:
  pull_request:
    paths:
      - '**/*.rs'
      - '**/*.sql'
      - 'sqlx-data.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && github.ref != 'refs/heads/main' }}

jobs:
  sqlx-check:
    name: Verify SQLx queries
    runs-on: ubuntu-latest
    # `cargo sqlx prepare --check` re-describes every query against a live server and diffs the
    # result against .sqlx, so it needs a database with the migrations applied. Without one the
    # step fails before it checks anything ("`--database-url` or `DATABASE_URL` must be set"),
    # which is how this job came to fail on every run since 2026-07-20 — the check was never
    # actually verifying the cache.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # This workspace depends on private git repos. Without this, libgit2 cannot use the
      # credentials actions/checkout configures, `cargo metadata` fails to resolve them, and
      # sqlx-cli reports the unhelpful "Issue parsing `cargo metadata` output". lint.yml already
      # sets this for the same reason.
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v3
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      # Pinned to ~0.8 on two counts: sqlx-cli 0.9.0 raised its MSRV to 1.94, above the
      # nightly-2025-09-15 that rust-toolchain.toml pins for the SP1 zkVM build; and the cache
      # format has to match the sqlx the workspace compiles against (0.8.x), or a correct cache
      # reads as stale. Drop the pin only when both move together.
      - name: Install SQLx CLI
        run: cargo install sqlx-cli --version '~0.8' --no-default-features --features native-tls,postgres

      - name: Apply migrations
        run: cd validity && sqlx migrate run

      # sqlx-cli swallows the real error behind "Issue parsing `cargo metadata` output", so run it
      # directly first: if dependency resolution is what broke, the failure is legible here.
      - name: Resolve workspace metadata
        run: cargo metadata --format-version 1 > /dev/null

      - name: Verify SQLx query files
        run: cd validity && cargo sqlx prepare --check