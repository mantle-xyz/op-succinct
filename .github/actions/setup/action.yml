name: Test setup
description: "Setup test environment with Rust and dependencies"
inputs:
  pull_token:
    description: "Token to use for private repo access"
    required: true
runs:
  using: "composite"
  steps:
    - name: Install GCC, OpenSSL, Perl and other dependencies
      shell: bash
      run: |
        sudo yum update -y
        sudo yum install -y gcc gcc-c++ make pkg-config openssl-devel clang llvm llvm-devel clang-devel perl perl-core unzip
        gcc --version
        perl --version
        # Install protoc v25.3 (yum version too old, needs 3.15+ for proto3 optional)
        curl -LO https://github.com/protocolbuffers/protobuf/releases/download/v25.3/protoc-25.3-linux-x86_64.zip
        unzip -o protoc-25.3-linux-x86_64.zip -d $HOME/.local
        echo "PROTOC=$HOME/.local/bin/protoc" >> $GITHUB_ENV
        $HOME/.local/bin/protoc --version
        
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.85

    - name: Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: "stable"
        cache-directories: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/