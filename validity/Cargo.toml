[package]
name = "op-succinct-validity"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "validity"
path = "bin/validity.rs"

[dependencies]

# workspace
tokio.workspace = true
alloy-primitives.workspace = true

# tracing and telemetry
tracing.workspace = true


# local
op-succinct-client-utils.workspace = true
op-succinct-elfs.workspace = true
op-succinct-host-utils.workspace = true
op-succinct-proof-utils.workspace = true
op-succinct-signer-utils.workspace = true

# sp1
sp1-sdk.workspace = true
sp1-cluster-utils.workspace = true
# [MANTLE] Pinned to the tonic the pinned sp1-sdk uses (0.14.x since SP1 6.10.0; 0.12.x through
# SP1 6.8.1) so downcasting an SDK RPC error to `tonic::Status` resolves the SAME type the SDK
# produced. A mismatch silently makes the downcast return None, and the proposer then bisects
# ranges on UNAVAILABLE / FAILED_PRECONDITION. Bump this together with sp1-sdk;
# `proposer::admission_shed_tests::tonic_matches_the_sdk` fails when they diverge. Only the core
# `Status`/`Code` types are needed, so no transport/codegen features.
tonic = { version = "0.14", default-features = false }

# alloy
alloy-eips.workspace = true
alloy-provider = { workspace = true }
alloy-signer-local.workspace = true
alloy-sol-types.workspace = true
alloy-rpc-types-eth.workspace = true
# Needed to downcast a relay failure to `RpcError` and read its revert data as bytes, instead of
# classifying the rejection by matching the rendered error string. See src/relay_rejection.rs.
alloy-transport.workspace = true

anyhow.workspace = true
dotenv.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true

# server
bincode.workspace = true
base64.workspace = true
serde_repr = "0.1.19"
sqlx = { version = "0.8.3", features = [
    "postgres",
    "chrono",
    "bigdecimal",
    "runtime-tokio",
    "tls-native-tls",
] }
chrono = "0.4.39"
futures-util = "0.3.31"
clap.workspace = true
tikv-jemallocator = "0.6.0"
rustls = "0.23.23"
strum = { workspace = true, features = ["derive"] }
strum_macros.workspace = true

[build-dependencies]
op-succinct-build-utils.workspace = true

[dev-dependencies]
postgresql_embedded = { version = "0.20", features = ["bundled"] }
alloy-json-rpc.workspace = true

[features]
default = []
