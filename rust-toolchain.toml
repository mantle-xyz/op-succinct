[toolchain]
# [MANTLE] Our mantle-v2 dep family declares `rust-version = "1.94"`
# (kona-genesis, alloy-op-evm, op-alloy, etc.), so the pin has to stay on a
# nightly past 1.94 stabilization for `rustc-dev` to remain available to build
# scripts. Upstream v3.12.0's own pin (nightly-2026-05-15) is a superset of that
# constraint, so we track it rather than holding our older nightly-2026-02-15.
channel = "nightly-2026-05-15"
components = ["llvm-tools", "rustc-dev", "rustfmt", "clippy"]
