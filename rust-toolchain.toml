[toolchain]
# [MANTLE] Bumped from nightly-2025-09-15 (rustc 1.92-nightly) — that was the
# upstream Succinct Labs v3.8.1 pin, but our mantle-v2 dep family declares
# `rust-version = "1.94"` (kona-genesis, alloy-op-evm, op-alloy, etc.). Stay
# on a nightly past 1.94 stabilization so `rustc-dev` stays available for
# build scripts. nightly-2026-02-15 = rustc 1.95.0-nightly.
channel = "nightly-2026-02-15"
components = ["llvm-tools", "rustc-dev", "rustfmt", "clippy"]
